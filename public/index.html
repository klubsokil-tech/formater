<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOCX Formatter UI</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; max-width: 1000px; }
      .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
      button { padding: 8px 14px; cursor: pointer; }
      progress { width: 100%; height: 22px; }
      .muted { color: #666; }
      .log { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; }
      .status { font-weight: bold; }
      .ok { color: #0b7a0b; }
      .warn { color: #ad6a00; }
      .err { color: #c01616; }
      ul { margin-top: 8px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
      label { display: block; }
      .full { grid-column: 1 / -1; }
      select { padding: 4px; }
    </style>
  </head>
  <body>
    <h1>Academic DOCX Formatter — UI</h1>

    <div class="card">
      <h2>1) Оберіть файл та опції редагування</h2>
      <form id="uploadForm">
        <p><input id="document" name="document" type="file" accept=".docx" required /></p>

        <div class="grid">
          <label><input type="checkbox" id="applyPageSetup" checked /> Параметри сторінки (поля + книжкова орієнтація)</label>
          <label><input type="checkbox" id="applyTextFormatting" checked /> Шрифт TNR 14, інтервал 1.5, абзац 1.25 см, вирівнювання по ширині</label>
          <label><input type="checkbox" id="applyHeadingStyles" checked /> Стилі заголовків (жирний, по центру, чорний колір)</label>
          <label><input type="checkbox" id="enforceSectionPageBreaks" checked /> Розрив сторінки перед кожним розділом</label>
          <label><input type="checkbox" id="addBlankLinesAroundHeadings" checked /> Порожній рядок до/після кожного заголовка</label>
          <label><input type="checkbox" id="addTOC" checked /> Додати автоматичний зміст (TOC)</label>
          <label><input type="checkbox" id="addRandomCitations" checked /> Додавати випадкові посилання [номер, с. сторінка]</label>
          <label><input type="checkbox" id="normalizeBracketCitations" checked /> Уніфікувати формат посилань у квадратних дужках</label>
          <label><input type="checkbox" id="ensureBibliography" checked /> Додавати список джерел, якщо його немає</label>
          <label><input type="checkbox" id="preserveSpecialContent" checked /> Не змінювати корейські символи та спецконтент</label>

          <label class="full">Сортування джерел:
            <select id="bibliographySort">
              <option value="order" selected>Порядок згадування (order)</option>
              <option value="alpha">За алфавітом (alpha)</option>
            </select>
          </label>
        </div>

        <p><button type="submit">Запустити форматування</button></p>
      </form>
      <p class="muted">Усі параметри опційні: ви можете вимкнути непотрібні перед запуском.</p>
    </div>

    <div class="card">
      <h2>2) Процес виконання</h2>
      <p>Статус: <span id="status" class="status">очікування</span></p>
      <progress id="progress" value="0" max="100"></progress>
      <p><span id="progressText">0%</span></p>
      <div id="log" class="log"></div>
    </div>

    <div class="card">
      <h2>3) Звіт</h2>
      <div id="report">Звіт ще не сформовано.</div>
    </div>

    <script>
      const form = document.getElementById('uploadForm');
      const statusEl = document.getElementById('status');
      const progressEl = document.getElementById('progress');
      const progressTextEl = document.getElementById('progressText');
      const logEl = document.getElementById('log');
      const reportEl = document.getElementById('report');

      let pollTimer = null;

      function setStatus(text, cls = '') {
        statusEl.textContent = text;
        statusEl.className = `status ${cls}`.trim();
      }

      function getEditOptions() {
        return {
          addTOC: document.getElementById('addTOC').checked,
          addRandomCitations: document.getElementById('addRandomCitations').checked,
          normalizeBracketCitations: document.getElementById('normalizeBracketCitations').checked,
          ensureBibliography: document.getElementById('ensureBibliography').checked,
          bibliographySort: document.getElementById('bibliographySort').value,
          applyPageSetup: document.getElementById('applyPageSetup').checked,
          applyTextFormatting: document.getElementById('applyTextFormatting').checked,
          applyHeadingStyles: document.getElementById('applyHeadingStyles').checked,
          enforceSectionPageBreaks: document.getElementById('enforceSectionPageBreaks').checked,
          addBlankLinesAroundHeadings: document.getElementById('addBlankLinesAroundHeadings').checked,
          preserveSpecialContent: document.getElementById('preserveSpecialContent').checked,
        };
      }

      function renderLog(lines = []) {
        logEl.innerHTML = lines.map((line) => `<div>• ${line}</div>`).join('');
        logEl.scrollTop = logEl.scrollHeight;
      }

      function renderReport(job) {
        if (!job) {
          reportEl.textContent = 'Звіт ще не сформовано.';
          return;
        }

        const stats = job.formatStats;
        const verify = job.verifyReport;

        const optionsHtml = stats?.optionsUsed ? `
          <h3>Застосовані опції</h3>
          <ul>
            ${Object.entries(stats.optionsUsed).map(([key, value]) => `<li><b>${key}</b>: ${String(value)}</li>`).join('')}
          </ul>` : '';

        const notesHtml = stats?.notes?.length ? `
          <h3>Нотатки</h3>
          <ul>${stats.notes.map((note) => `<li>${note}</li>`).join('')}</ul>` : '';

        const statsHtml = stats ? `
          <h3>Форматування</h3>
          <ul>
            <li>Абзаців у вхідному файлі: <b>${stats.sourceParagraphs}</b></li>
            <li>Абзаців у вихідному файлі: <b>${stats.outputParagraphs}</b></li>
            <li>Додано посилань: <b>${stats.citationsAdded}</b></li>
            <li>Додано список джерел: <b>${stats.bibliographyAdded ? 'так' : 'ні'}</b></li>
          </ul>` : '';

        const verifyHtml = verify ? `
          <h3>Перевірка</h3>
          <ul>
            ${verify.results.map((item) => `<li>${item.pass ? '✅' : '❌'} ${item.name}</li>`).join('')}
          </ul>
          <p><b>Підсумок:</b> ${verify.ok ? 'PASS ✅' : `FAIL ❌ (${verify.failedCount} невідповідностей)`}</p>` : '';

        const downloadHtml = job.outputFilename
          ? `<p><a href="/api/jobs/${job.id}/download">Завантажити output DOCX</a></p>`
          : '';

        const errorHtml = job.error ? `<p class="err"><b>Помилка:</b> ${job.error}</p>` : '';

        reportEl.innerHTML = `${errorHtml}${statsHtml}${optionsHtml}${notesHtml}${verifyHtml}${downloadHtml}` || 'Немає даних.';
      }

      async function pollJob(jobId) {
        const response = await fetch(`/api/jobs/${jobId}`);
        if (!response.ok) {
          setStatus('помилка', 'err');
          reportEl.innerHTML = '<p class="err">Не вдалося отримати стан завдання.</p>';
          return;
        }

        const job = await response.json();
        progressEl.value = job.progress || 0;
        progressTextEl.textContent = `${job.progress || 0}%`;
        renderLog(job.log || []);
        renderReport(job);

        if (job.status === 'failed') {
          setStatus('з помилкою', 'err');
          clearInterval(pollTimer);
          return;
        }
        if (job.status === 'completed') {
          setStatus('завершено', 'ok');
          clearInterval(pollTimer);
          return;
        }
        if (job.status === 'completed_with_warnings') {
          setStatus('завершено з попередженнями', 'warn');
          clearInterval(pollTimer);
          return;
        }

        setStatus('виконується...', '');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const fileInput = document.getElementById('document');
        if (!fileInput.files.length) return;

        clearInterval(pollTimer);
        setStatus('завантаження...', '');
        progressEl.value = 0;
        progressTextEl.textContent = '0%';
        logEl.innerHTML = '';
        reportEl.textContent = 'Формування звіту...';

        const file = fileInput.files[0];
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const result = String(reader.result || '');
            const b64 = result.includes(',') ? result.split(',')[1] : result;
            resolve(b64);
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const selectedOptions = getEditOptions();

        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filename: file.name,
            contentBase64: base64,
            editOptions: selectedOptions,
            options: selectedOptions,
          }),
        });

        const payload = await response.json();
        if (!response.ok) {
          setStatus('помилка', 'err');
          reportEl.innerHTML = `<p class="err">${payload.error || 'Невідома помилка.'}</p>`;
          return;
        }

        const { jobId } = payload;
        setStatus('виконується...', '');
        pollTimer = setInterval(() => pollJob(jobId), 800);
        pollJob(jobId);
      });
    </script>
  </body>
</html>
